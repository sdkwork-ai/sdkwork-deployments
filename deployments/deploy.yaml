version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: deploy-admin.sdkwork.com
        tls: sdkwork.com
        mode: api
        aliases:
          - deploy-app.sdkwork.com
          - deploy.sdkwork.com
      - domain: deploy-admin.birdcoder.com
        tls: birdcoder.com
        mode: api
        aliases:
          - deploy-app.birdcoder.com
          - deploy.birdcoder.com
      - domain: deploy-admin.dtupay.com
        tls: dtupay.com
        mode: api
        aliases:
          - deploy-app.dtupay.com
          - deploy.dtupay.com
      - domain: deploy-admin.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        aliases:
          - deploy-app.sdkwork.cn
          - deploy.sdkwork.cn
      - domain: deploy-admin.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        aliases:
          - deploy-app.birdcoder.cn
          - deploy.birdcoder.cn
      - domain: deploy-admin.dtupay.cn
        tls: dtupay.cn
        mode: api
        aliases:
          - deploy-app.dtupay.cn
          - deploy.dtupay.cn
      - domain: deploy-admin.skubc.com
        tls: skubc.com
        mode: api
        aliases:
          - deploy-app.skubc.com
          - deploy.skubc.com
      - domain: deploy-admin.skubc.cn
        tls: skubc.cn
        mode: api
        aliases:
          - deploy-app.skubc.cn
          - deploy.skubc.cn
      - domain: deploy-admin.zowalk.com
        tls: zowalk.com
        mode: api
        aliases:
          - deploy-app.zowalk.com
          - deploy.zowalk.com
      - domain: deploy-admin.zowalk.cn
        tls: zowalk.cn
        mode: api
        aliases:
          - deploy-app.zowalk.cn
          - deploy.zowalk.cn
      - domain: deploy-admin.offer86.com
        tls: offer86.com
        mode: api
        aliases:
          - deploy-app.offer86.com
          - deploy.offer86.com
      - domain: deploy-admin.offer86.cn
        tls: offer86.cn
        mode: api
        aliases:
          - deploy-app.offer86.cn
          - deploy.offer86.cn
      - domain: deploy-admin.86offer.com
        tls: 86offer.com
        mode: api
        aliases:
          - deploy-app.86offer.com
          - deploy.86offer.com
      - domain: deploy-admin.86offer.cn
        tls: 86offer.cn
        mode: api
        aliases:
          - deploy-app.86offer.cn
          - deploy.86offer.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
