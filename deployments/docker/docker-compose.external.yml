# =============================================================================
# SDKWork Deploy — external dependency overrides
# =============================================================================
# The gateway and worker connect to PostgreSQL and Redis that are provisioned
# OUTSIDE compose (host.docker.internal by default, per scripts/generate-env.sh).
#
# On Linux, `host.docker.internal` is not resolved by default. This override maps
# it to the host gateway so the external-dependency mode works cross-platform
# (Windows/macOS Docker Desktop resolve it natively; Linux needs this shim).
#
# This file is always merged after docker-compose.yml by scripts/deploy.sh:
#   docker compose -f docker-compose.yml -f docker-compose.external.yml ...
# =============================================================================

# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
  # Both certificate processes read the same external PostgreSQL as the gateway:
  # the planner writes the renewal order, the executor claims it. Without the
  # host-gateway alias they cannot resolve `host.docker.internal` on Linux and
  # crash-loop on connect.
  certificate-renewal:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
  certificate-issuance:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
