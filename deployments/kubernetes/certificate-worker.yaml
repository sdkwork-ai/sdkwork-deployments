# SDKWork Deploy certificate issuance worker (cloud profile).
#
# The renewal worker opens an order; nothing used to consume it. This worker is
# the other half of PLAN-2026-0003 §9: it claims due `deploy_certificate_order`
# rows with a leased `FOR UPDATE SKIP LOCKED` claim, drives each one through the
# accepted 9-state machine (REQUESTED → ACCOUNT_READY → ORDER_PENDING →
# CHALLENGE_PRESENTING → CHALLENGE_VALIDATING → FINALIZING → VERSION_STORED),
# validates the issued material before storing a version, and seals the bundle
# with the certificate-material master key while the row keeps only public
# evidence plus an opaque `secret://` reference.
#
# Challenge routing is fixed by scope, not by operator choice:
#   * exact names  → HTTP-01 against the shared ACME webroot below;
#   * WILDCARD     → automatic DNS-01, which needs a provider credential (§8.3).
# A wildcard with no resolvable credential is refused before an ACME order is
# created, and the order fails with `ORDER_ERROR_VALIDATION_FAILED` rather than
# being left leased.
#
# `replicas: 1` with `Recreate`, not the renewal worker's rolling pair. Two
# reasons, both about identity rather than throughput:
#   * `SDKWORK_DEPLOY_CERTIFICATE_ISSUANCE_WORKER_ID` is recorded verbatim in
#     `deploy_certificate_order.lease_owner`, and the encrypted ACME account
#     store below is keyed by that identity — a rolling replacement must not mint
#     a second one for the same logical worker;
#   * the `sdkwork-deploy-certificate-state` claim is ReadWriteOnce and carries
#     the ACME account credentials and the HTTP-01 webroot, so a second pod on
#     another node could not mount it anyway.
# The database lease is still what makes a stuck pod's work reclaimable; the
# single replica is about state, not about correctness of the claim protocol.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-deploy-certificate-worker
  labels:
    app.kubernetes.io/name: sdkwork-deploy
    app.kubernetes.io/component: certificate-worker
    app.kubernetes.io/part-of: sdkwork-deploy
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-deploy
      app.kubernetes.io/component: certificate-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-deploy
        app.kubernetes.io/component: certificate-worker
        app.kubernetes.io/part-of: sdkwork-deploy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: certificate-worker
          image: sdkwork-api-deployments-standalone-gateway:latest
          imagePullPolicy: IfNotPresent
          command:
            - sdkwork-deploy-certificate-worker
          env:
            - name: SDKWORK_DEPLOY_APP_ROOT
              value: /app
            - name: SDKWORK_DEPLOY_ENVIRONMENT
              value: production
            - name: SDKWORK_ENVIRONMENT
              value: production
            - name: SDKWORK_DEPLOY_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_DEPLOY_PROFILE_ID
              value: cloud.production
            # Lease identity. Explicit and stable on purpose: the ACME account
            # store is keyed by it, so a replacement pod must inherit the same
            # identity instead of registering a second CA account.
            - name: SDKWORK_DEPLOY_CERTIFICATE_ISSUANCE_WORKER_ID
              value: certificate-worker-0
            - name: SDKWORK_DEPLOY_CERTIFICATE_ISSUANCE_BATCH_SIZE
              value: "10"
            - name: SDKWORK_DEPLOY_CERTIFICATE_ISSUANCE_POLL_INTERVAL_MILLIS
              value: "15000"
            # Must stay strictly greater than SDKWORK_DEPLOY_ACME_OPERATION_TIMEOUT_MS
            # below. The worker refuses to start otherwise: a lease that expires
            # while an ACME order is still in flight would hand live order state
            # to a second worker, which is exactly what the fence prevents.
            - name: SDKWORK_DEPLOY_CERTIFICATE_ISSUANCE_LEASE_SECONDS
              value: "900"
            - name: SDKWORK_DEPLOY_ACME_OPERATION_TIMEOUT_MS
              value: "180000"
            # Public issuance must be asked for explicitly. The default is
            # staging in every environment, because guessing "production" burns
            # the CA rate limit and logs a public certificate, while guessing
            # staging costs one restart.
            - name: SDKWORK_DEPLOY_ACME_PROFILE
              value: production
            - name: SDKWORK_DEPLOY_ACME_CONTACT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-certificate
                  key: acme-contact-email
            - name: SDKWORK_DEPLOY_CERT_RENEW_BEFORE_DAYS
              value: "30"
            - name: SDKWORK_DEPLOY_CERT_LIVE_ROOT
              value: /var/lib/sdkwork/deploy/cert-live
            # HTTP-01 challenge webroot. This is the same variable the Web
            # Server edge reads; the public edge must serve
            # `/.well-known/acme-challenge/` from this same claim, or every
            # exact-name order fails validation with no error in this pod.
            - name: SDKWORK_WEBSERVER_ACME_WEBROOT
              value: /var/lib/sdkwork/deploy/acme-webroot
            # Encrypted ACME account store: one account per CA directory, reused
            # across restarts so the deployment does not burn the CA's account
            # creation limit. Needs both the root and the master key, or the
            # account lives only in process memory and every restart mints a new
            # CA account.
            - name: SDKWORK_DEPLOY_ACME_ACCOUNT_ROOT
              value: /var/lib/sdkwork/deploy/acme-accounts
            - name: SDKWORK_DEPLOY_ACME_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-certificate
                  key: acme-account-master-key
            # DNS-01 credentials are resolved in this order: the account pinned on the
            # certificate, the account pinned on its zone, the account the IAM cloud
            # account center picks for the zone's declared provider, and only then the
            # deployment-wide credential below. The account center needs no secret here
            # because this pod reaches it over its own PostgreSQL connection.
            - name: SDKWORK_DEPLOY_USE_MEMORY_CLOUD_ACCOUNTS
              value: "false"
            # Deployment-wide automatic DNS-01 credential (PLAN-2026-0003 §8.3).
            # Optional on purpose: with no `sdkwork-deploy-dns-provider` secret the
            # variables are simply unset, the resolver answers "no provider", and
            # wildcard orders fail closed with a bounded code instead of waiting on
            # a TXT record nobody created. Set the secret to enable automatic
            # wildcard issuance for names inside `dns-zone-apex` on an installation
            # that never registered a cloud account.
            - name: SDKWORK_DEPLOY_DNS_PROVIDER_KIND
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-dns-provider
                  key: provider-kind
                  optional: true
            - name: SDKWORK_DEPLOY_DNS_PROVIDER_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-dns-provider
                  key: credential
                  optional: true
            - name: SDKWORK_DEPLOY_DNS_ZONE_APEX
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-dns-provider
                  key: zone-apex
                  optional: true
            - name: SDKWORK_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-database
                  key: database-url
            # Custody of certificate material at rest, mounted rather than passed
            # as a value: an environment variable is readable from every process
            # listing and container inspect, and a key stored beside the data it
            # protects protects nothing (ADR-20260723 §4).
            - name: SDKWORK_DEPLOY_CERTIFICATE_MASTER_KEY_FILE
              value: /run/secrets/sdkwork-certificate/kek
            - name: SDKWORK_DEPLOY_TRUST_ANCHOR_FILE
              value: /run/secrets/sdkwork-certificate/trust-anchors.pem
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certificate-state
              mountPath: /var/lib/sdkwork/deploy
            - name: certificate-material-secrets
              mountPath: /run/secrets/sdkwork-certificate
              readOnly: true
      volumes:
        - name: certificate-state
          persistentVolumeClaim:
            claimName: sdkwork-deploy-certificate-state
        - name: certificate-material-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sdkwork-deploy-certificate-material
---
# Shared by the issuance worker and the public edge: it carries the encrypted
# ACME account credentials, the HTTP-01 challenge webroot, and the projected
# certificate live root. ReadWriteMany is required only because the edge mounts
# it read-only from a different node; a single-node installation may use
# ReadWriteOnce.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdkwork-deploy-certificate-state
  labels:
    app.kubernetes.io/name: sdkwork-deploy
    app.kubernetes.io/component: certificate-worker
    app.kubernetes.io/part-of: sdkwork-deploy
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
