apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-api-deployments-standalone-gateway
  labels:
    app.kubernetes.io/name: sdkwork-deploy
    app.kubernetes.io/component: standalone-gateway
    app.kubernetes.io/part-of: sdkwork-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-deploy
      app.kubernetes.io/component: standalone-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-deploy
        app.kubernetes.io/component: standalone-gateway
        app.kubernetes.io/part-of: sdkwork-deploy
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: standalone-gateway
          image: sdkwork-api-deployments-standalone-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3900
              protocol: TCP
          env:
            - name: SDKWORK_DEPLOY_APP_ROOT
              value: /app
            - name: SDKWORK_DEPLOY_ENVIRONMENT
              value: production
            - name: SDKWORK_ENVIRONMENT
              value: production
            - name: SDKWORK_DEPLOY_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_DEPLOY_PROFILE_ID
              value: cloud.production
            - name: SDKWORK_DEPLOY_APPLICATION_PUBLIC_INGRESS_BIND
              value: "0.0.0.0:3900"
            - name: SDKWORK_CORS_ALLOWED_ORIGINS
              value: https://deploy.sdkwork.com
            - name: SDKWORK_NODE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SDKWORK_DEPLOY_USE_MEMORY_DRIVE
              value: "false"
            - name: SDKWORK_DRIVE_FACADE_URL
              value: https://api.sdkwork.com
            - name: SDKWORK_DEPLOY_USE_MEMORY_CONTENT_PROVIDER
              value: "false"
            # DNS provider credentials come from the IAM cloud account center, which
            # this process reaches through its own PostgreSQL pool. The `USE_MEMORY_*`
            # convention above does not apply: memory is the exception here, and
            # production refuses it even when asked for.
            - name: SDKWORK_DEPLOY_USE_MEMORY_CLOUD_ACCOUNTS
              value: "false"
            - name: SDKWORK_DEPLOY_DRIVE_INTERNAL_API_URL
              value: https://drive-internal.sdkwork.com
            - name: SDKWORK_DEPLOY_DRIVE_INTERNAL_API_INGRESS_TOKEN_FILE
              value: /run/secrets/sdkwork/deploy-drive-internal-ingress-token
            - name: SDKWORK_DEPLOY_KNOWLEDGEBASE_INTERNAL_API_URL
              value: https://knowledgebase.sdkwork.com
            - name: SDKWORK_DEPLOY_KNOWLEDGEBASE_INTERNAL_API_INGRESS_TOKEN_FILE
              value: /run/secrets/sdkwork/deploy-knowledgebase-internal-ingress-token
            - name: SDKWORK_DEPLOY_WEB_INTERNAL_API_URL
              value: https://web-internal.sdkwork.com
            - name: SDKWORK_DEPLOY_WEB_INTERNAL_API_INGRESS_TOKEN_FILE
              value: /run/secrets/sdkwork/deploy-web-internal-ingress-token
            - name: SDKWORK_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-database
                  key: database-url
          volumeMounts:
            - name: provider-ingress-tokens
              mountPath: /run/secrets/sdkwork
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
        - name: provider-ingress-tokens
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: sdkwork-deploy-web-internal
                  items:
                    - key: ingress-token
                      path: deploy-web-internal-ingress-token
              - secret:
                  name: sdkwork-deploy-drive-internal
                  items:
                    - key: ingress-token
                      path: deploy-drive-internal-ingress-token
              - secret:
                  name: sdkwork-deploy-knowledgebase-internal
                  items:
                    - key: ingress-token
                      path: deploy-knowledgebase-internal-ingress-token
      terminationGracePeriodSeconds: 30
