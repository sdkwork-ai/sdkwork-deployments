apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-deploy-runtime-assignment-worker
  labels:
    app.kubernetes.io/name: sdkwork-deploy
    app.kubernetes.io/component: runtime-assignment-worker
    app.kubernetes.io/part-of: sdkwork-deploy
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-deploy
      app.kubernetes.io/component: runtime-assignment-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-deploy
        app.kubernetes.io/component: runtime-assignment-worker
        app.kubernetes.io/part-of: sdkwork-deploy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: runtime-assignment-worker
          image: sdkwork-api-deployments-standalone-gateway:latest
          imagePullPolicy: IfNotPresent
          command:
            - sdkwork-deploy-runtime-assignment-worker
          env:
            - name: SDKWORK_DEPLOY_APP_ROOT
              value: /app
            - name: SDKWORK_DEPLOY_ENVIRONMENT
              value: production
            - name: SDKWORK_ENVIRONMENT
              value: production
            - name: SDKWORK_DEPLOY_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_DEPLOY_PROFILE_ID
              value: cloud.production
            - name: SDKWORK_NODE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SDKWORK_DEPLOY_RUNTIME_ASSIGNMENT_BATCH_SIZE
              value: "50"
            - name: SDKWORK_DEPLOY_RUNTIME_ASSIGNMENT_POLL_INTERVAL_MILLIS
              value: "1000"
            - name: SDKWORK_DEPLOY_RUNTIME_ASSIGNMENT_LEASE_SECONDS
              value: "30"
            - name: SDKWORK_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-deploy-database
                  key: database-url
            - name: SDKWORK_DEPLOY_WEB_INTERNAL_API_URL
              value: https://web-internal.sdkwork.com
            - name: SDKWORK_DEPLOY_WEB_INTERNAL_API_INGRESS_TOKEN_FILE
              value: /run/secrets/sdkwork/deploy-web-internal-ingress-token
            - name: SDKWORK_DEPLOY_WEBSITE_PROVIDER_EVENT_CALLBACK_BASE_URL
              value: https://web-provider-events.sdkwork.com
            - name: SDKWORK_DEPLOY_WEBSITE_PROVIDER_EVENT_SECRET_DIRECTORY
              value: /run/secrets/sdkwork-website-provider-events
            - name: SDKWORK_DEPLOY_WEBSITE_PROVIDER_EVENT_EXPIRATION_SECONDS
              value: "86400"
            - name: SDKWORK_DEPLOY_WEBSITE_PROVIDER_EVENT_RENEW_BEFORE_SECONDS
              value: "3600"
          volumeMounts:
            - name: internal-api-ingress-tokens
              mountPath: /run/secrets/sdkwork
              readOnly: true
            - name: website-provider-event-node-secrets
              mountPath: /run/secrets/sdkwork-website-provider-events
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: internal-api-ingress-tokens
          projected:
            sources:
              - secret:
                  name: sdkwork-deploy-web-internal
                  items:
                    - key: ingress-token
                      path: deploy-web-internal-ingress-token
              - secret:
                  name: sdkwork-deploy-drive-internal
                  items:
                    - key: ingress-token
                      path: deploy-drive-internal-ingress-token
        - name: website-provider-event-node-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sdkwork-deploy-website-provider-events
