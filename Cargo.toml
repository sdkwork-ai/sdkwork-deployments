sdkwork-webserver-delivery-runtime = { path = "../sdkwork-webserver/crates/sdkwork-webserver-delivery-runtime" }
sdkwork-webserver-knowledgebase-provider = { path = "../sdkwork-webserver/crates/sdkwork-webserver-knowledgebase-provider" }
