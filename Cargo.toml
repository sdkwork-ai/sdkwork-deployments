[workspace]
resolver = "2"
members = [
  "crates/sdkwork-api-deployments-assembly",
  "crates/sdkwork-deploy-database-host",
  "crates/sdkwork-deploy-drive-port",
  "crates/sdkwork-deploy-content-provider-port",
  "crates/sdkwork-deploy-runtime-compiler",
  "crates/sdkwork-deploy-runtime-assignment-worker",
  "crates/sdkwork-deploy-service-host",
  "crates/sdkwork-deploy-web-port",
  "crates/sdkwork-routes-deploy-common",
  "crates/sdkwork-deploy-contract",
  "crates/sdkwork-deploy-core",
  "crates/sdkwork-intelligence-deploy-service",
  "crates/sdkwork-intelligence-deploy-repository-sqlx",
  "crates/sdkwork-routes-deploy-app-api",
  "crates/sdkwork-routes-deploy-backend-api",
  "crates/sdkwork-api-deployments-standalone-gateway",
  "crates/sdkwork-deploy-build-runner",
  "crates/sdkwork-deploy-package-validator",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
base64 = "0.22"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
http = "1.4"
serde = { version = "1", features = ["derive"] }
http-body-util = "0.1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
hickory-resolver = "0.25.2"
idna = "1"
psl = "2.1.184"
url = "2"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
tar = "0.4"
zip = "2"
zeroize = "1"

sdkwork-deploy-contract = { path = "crates/sdkwork-deploy-contract" }
sdkwork-deploy-core = { path = "crates/sdkwork-deploy-core" }
sdkwork-deploy-drive-port = { path = "crates/sdkwork-deploy-drive-port" }
sdkwork-deploy-content-provider-port = { path = "crates/sdkwork-deploy-content-provider-port" }
sdkwork-deploy-runtime-compiler = { path = "crates/sdkwork-deploy-runtime-compiler" }
sdkwork-deploy-service-host = { path = "crates/sdkwork-deploy-service-host" }
sdkwork-deploy-web-port = { path = "crates/sdkwork-deploy-web-port" }
sdkwork-deploy-database-host = { path = "crates/sdkwork-deploy-database-host" }
sdkwork-intelligence-deploy-service = { path = "crates/sdkwork-intelligence-deploy-service" }
sdkwork-intelligence-deploy-repository-sqlx = { path = "crates/sdkwork-intelligence-deploy-repository-sqlx" }
sdkwork-routes-deploy-app-api = { path = "crates/sdkwork-routes-deploy-app-api" }
sdkwork-routes-deploy-backend-api = { path = "crates/sdkwork-routes-deploy-backend-api" }
sdkwork-routes-deploy-common = { path = "crates/sdkwork-routes-deploy-common" }
sdkwork-api-deployments-standalone-gateway = { path = "crates/sdkwork-api-deployments-standalone-gateway" }
sdkwork-api-deployments-assembly = { path = "crates/sdkwork-api-deployments-assembly" }
sdkwork-deploy-build-runner = { path = "crates/sdkwork-deploy-build-runner" }
sdkwork-deploy-package-validator = { path = "crates/sdkwork-deploy-package-validator" }

sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-drift = { path = "../sdkwork-database/crates/sdkwork-database-drift", package = "sdkwork-database-drift" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
