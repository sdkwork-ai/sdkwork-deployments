sdkwork-webserver-internal-sdk = { path = "../sdkwork-webserver/sdks/sdkwork-webserver-internal-sdk/sdkwork-webserver-internal-sdk-rust/generated/server-openapi", package = "sdkwork-webserver-internal-sdk-generated-rust" }
