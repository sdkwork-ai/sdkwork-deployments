      - zoneId
      - hostname
      - relativeName
      - hostnameType
      - verificationStatus
      - status
      - certificateCount
      - bindingCount
      - createdAt
      - updatedAt
      - version
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        hostname:
          type: string
        relativeName:
          type: string
        hostnameType:
          type: string
          enum:
          - EXACT
          - WILDCARD
        verificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - FAILED
          - EXPIRED
        verifiedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        certificateCount:
          type: string
          format: int64
          minimum: 0
          x-sdkwork-int64-string: true
        bindingCount:
          type: string
          format: int64
          minimum: 0
          x-sdkwork-int64-string: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: ^[0-9]+$
    DomainVerifyResponse:
      type: object
      required:
      - verified
      - method
      properties:
        verified:
          type: boolean
        method:
          type: string
          enum:
          - DNS_TXT
        verificationId:
          type: string
          format: uuid
          description: 当前所有权验证尝试标识；域名已验证时可省略。
        recordName:
          type: string
          description: 需要配置 TXT 记录的完整规范名称；域名已验证时可省略。
        recordRelativeName:
          type: string
          description: 同一记录相对于其所属 zone 的主机记录名（即 DNS 服务商控制台的「主机记录」/「Host」字段值）；
            记录不在该 zone 内或 zone 未知时可省略。服务商控制台会自动追加自己的 zone，因此把完整名称填入该字段会发布错误的双域名记录。
        token:
