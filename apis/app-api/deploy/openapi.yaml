        dnsRecordRelativeName:
          type: string
          description: 同一记录相对于其所属 zone 的主机记录名（DNS 服务商控制台的「主机记录」/「Host」
            字段值）；记录不在已知 zone 内时省略。服务商控制台会自动追加自己的 zone。
        dnsRecordType:
          type: string
