          type: string
          format: int64
          minimum: 0
          x-sdkwork-int64-string: true
        certificateCount:
          type: string
          format: int64
          minimum: 0
          x-sdkwork-int64-string: true
        bindingCount:
          type: string
          format: int64
          minimum: 0
          x-sdkwork-int64-string: true
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: ^[0-9]+$
    CloudAccountResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - accountCode
      - displayName
      - vendorCode
      - scopeType
      - tenantGlobal
      - isDefault
      - status
      - credentialConfigured
      description: >-
        A DNS-capable cloud account, projected from the platform provider account
        center where its credential is held and rotated. Deploy never returns
        credential material here, only whether one is configured. `tenantGlobal`
        is the wire form of the 租户全局 / 我的账号 split and is derived from
        `scopeType`, so the two cannot disagree.
      properties:
        id:
          type: string
          description: Account id in the provider account center.
        accountCode:
          type: string
        displayName:
          type: string
        vendorCode:
          type: string
          description: >-
            Cloud vendor, e.g. aliyun, tencent, cloudflare. The account center owns
            this vocabulary.
        dnsProvider:
          type: string
          enum:
          - ALIYUN_DNS
          - DNSPOD
          - CLOUDFLARE
          description: >-
            The DNS family this account drives, derived from `vendorCode`. Absent for
            a vendor that drives no supported family, which is why such an account is
            listed but cannot be bound.
        scopeType:
          type: string
          enum:
          - platform
          - tenant
          - user
        tenantGlobal:
          type: boolean
          description: >-
            True for `platform` and `tenant` accounts, which any member of the tenant
            may use; false for an account one user bound to themselves.
        ownerUserId:
          type: string
          description: Set for `user`-scope accounts only.
        isDefault:
          type: boolean
          description: Whether this account is its level's default for its vendor.
        status:
          type: string
          enum:
          - active
          - disabled
          - archived
        credentialConfigured:
          type: boolean
          description: >-
            Whether an active credential exists behind the account. An account
            without one can be listed but not bound: it looks configured and is not.
        capabilityCodes:
          type: array
          items:
            type: string
          description: >-
            Capabilities the account advertises. Empty means unspecified, which the
            account center treats as reusable for everything.
        environment:
          type: string
          enum:
          - development
          - sandbox
          - production
    CreateCloudAccountRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      - dnsProvider
      - secretAccessKey
      description: >-
        The fields are the union of what the supported families need so the console
        renders one form: `accessKeyId` is the public half (Aliyun AccessKeyId,
        DNSPod LoginId) and is unused by Cloudflare, while `secretAccessKey` is
        always the secret half (Aliyun AccessKeySecret, DNSPod ApiToken, Cloudflare
        ApiToken).
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        accountCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: ^[a-z][a-z0-9_]*$
          description: >-
            The account code within its scope, pre-filled by the console with a
            suggestion rather than derived server-side: a derived code collides the
            second time a tenant adds a second account for the same vendor.
        dnsProvider:
          type: string
          enum:
          - ALIYUN_DNS
          - DNSPOD
          - CLOUDFLARE
        scopeType:
          type: string
          enum:
          - platform
          - tenant
          - user
          default: tenant
          description: >-
            A tenant member may not publish a `platform` account; the account center
            refuses it, and the console offers the level only where it can succeed.
        environment:
          type: string
          enum:
          - development
          - sandbox
          - production
        isDefault:
          type: boolean
          default: false
          description: Promote this account to its level's default for its vendor.
        accessKeyId:
          type: string
          maxLength: 256
          description: Required by the key-pair families, ignored by bearer-token ones.
        secretAccessKey:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        sessionToken:
          type: string
          maxLength: 4096
          writeOnly: true
    CloudAccountRegistrationResponse:
      type: object
      additionalProperties: false
      required:
      - account
      - reused
      - credentialApplied
      properties:
        account:
          $ref: '#/components/schemas/CloudAccountResponse'
        reused:
          type: boolean
          description: >-
            True when an equivalent account already existed and was reused, so the
            console reports 已存在，直接复用 rather than 已创建.
        credentialApplied:
          type: boolean
          description: >-
            True when this call stored the secret. A reused account that already had
            a credential is left alone: silently rotating a credential another
            business module may be using is not this flow's decision to make.
    CreateDomainHostnameRequest:
      type: object
      additionalProperties: false
      required:
      - relativeName
      properties:
        relativeName:
          type: string
          minLength: 1
          maxLength: 253
          description: 'Relative name within the zone: "@" addresses the apex (already
            part of the zone), a label path such as www or api.eu creates multi-level
            subdomains, and "*" or "*.a" creates wildcard hostnames (the "*" label
            is accepted only as the leftmost label). Names are ASCII-only after IDNA
            conversion; leading/trailing dots, empty labels, and hyphen-edged labels
            are rejected.

            '
    UpdateDomainHostnameRequest:
      type: object
      additionalProperties: false
      required:
      - relativeName
      properties:
        relativeName:
          type: string
          minLength: 1
          maxLength: 253
          description: 'New relative name for the hostname, with the same syntax as
            create. Renaming invalidates the ownership proof (verification returns
            to PENDING) and is rejected while the hostname is bound to an application
            or a certificate, or when it targets the zone apex.

            '
