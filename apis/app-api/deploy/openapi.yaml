          items:
            type: string
            minLength: 1
            maxLength: 253
    DomainHostnameClaimResponse:
      type: object
      additionalProperties: false
      required:
      - hostname
      - verified
      properties:
        hostname:
          $ref: '#/components/schemas/DomainHostnameResponse'
        verified:
          type: boolean
          description: 'What this call''s ownership check observed. The caller can
            never assert success (ADR-20260723 §3), so `false` means the TXT record
            is not published yet — it does not mean the request failed. A hostname
            that is already VERIFIED reports `true` without a lookup.

