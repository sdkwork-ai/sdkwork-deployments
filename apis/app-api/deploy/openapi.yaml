    CreateDomainZoneRequest:
      type: object
      additionalProperties: false
      required:
      - apexHostname
      properties:
        apexHostname:
          type: string
          minLength: 3
          maxLength: 253
          description: 'A registrable root domain (zone apex) such as example.com
            or example.co.uk. Wildcard names and subdomains are not accepted; Unicode
            (IDN) names are converted to punycode automatically. The apex must not
            already exist as a hostname and must not overlap an existing root domain.

            '
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        dnsProvider:
          type: string
          minLength: 1
          maxLength: 64
        providerZoneRef:
          type: string
          minLength: 1
          maxLength: 512
        providerAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{1,127}$
          description: >-
            Cloud account that presents this zone's DNS-01 challenges, from the
            platform provider account center. Optional: omitting it leaves the zone
            unpinned, and issuance then resolves an account by provider and falls
            back to the deployment-level provider configuration. An account holding
            no credential is refused here rather than at the first certificate order
            that needs it.
    UpdateDomainZoneRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        dnsProvider:
          type: string
          minLength: 1
          maxLength: 64
        providerZoneRef:
          type: string
          minLength: 1
          maxLength: 512
        providerAccountId:
          type: string
          maxLength: 128
          description: >-
            Re-pins the zone's cloud account. An empty string clears the pin so the
            zone resolves an account per issuance; omitting the field leaves the
            current pin untouched.
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
    DomainZoneResponse:
      type: object
      additionalProperties: false
      required:
      - id
