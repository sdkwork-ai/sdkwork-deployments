components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the decimal-string app version, for example
        `"3"`.
      schema:
        type: string
        pattern: ^("[0-9]+"|[0-9]+)$
        maxLength: 24
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable command identity. Reuse with a different request is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    DomainZoneIdParam:
      name: zoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainHostnameIdParam:
      name: hostnameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateIdParam:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseIdParam:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        i18nKey:
          type: string
          description: Optional stable localization key such as errors.result.40001.
        locale:
          type: string
          description: Optional effective BCP 47 locale used by framework message
            mapping.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    UpdateAppCompositionRequest:
      type: object
      additionalProperties: false
      required:
      - environment
      - defaultVariantKey
      - resources
      - variants
      - mounts
      - bindings
      properties:
        environment:
          $ref: '#/components/schemas/AppPublishEnvironment'
        defaultVariantKey:
          $ref: '#/components/schemas/CompositionKey'
        resources:
          type: array
          minItems: 1
          maxItems: 512
          items:
            $ref: '#/components/schemas/AppResourceDefinition'
        variants:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/AppVariantDefinition'
        variantRules:
          type: array
          maxItems: 1024
          default: []
          items:
            $ref: '#/components/schemas/AppVariantRuleDefinition'
        mounts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            $ref: '#/components/schemas/AppMountDefinition'
        bindings:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/AppBindingDefinition'
        deliveryPolicy:
          $ref: '#/components/schemas/AppDeliveryPolicy'
        securityPolicy:
          $ref: '#/components/schemas/AppSecurityPolicy'
        limits:
          $ref: '#/components/schemas/AppRuntimeLimits'
        observabilityPolicy:
          $ref: '#/components/schemas/AppObservabilityPolicy'
    AppPublishEnvironment:
      type: string
      enum:
      - development
      - test
      - staging
      - production
    CompositionKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9._:-]+$
    AppResourceDefinition:
      type: object
      additionalProperties: false
      required:
      - key
      - source
      properties:
        key:
          $ref: '#/components/schemas/CompositionKey'
        source:
          oneOf:
          - $ref: '#/components/schemas/DriveDirectorySource'
          - $ref: '#/components/schemas/KnowledgebaseWikiSource'
          discriminator:
            propertyName: type
            mapping:
              DRIVE_DIRECTORY: '#/components/schemas/DriveDirectorySource'
              KNOWLEDGEBASE_WIKI: '#/components/schemas/KnowledgebaseWikiSource'
    DriveDirectorySource:
      type: object
      additionalProperties: false
      required:
      - type
      - websiteSpaceId
      - root
      - contentMode
      properties:
        type:
          const: DRIVE_DIRECTORY
        websiteSpaceId:
          type: string
          minLength: 1
          maxLength: 128
        root:
          oneOf:
          - $ref: '#/components/schemas/DriveSpaceRootSelector'
          - $ref: '#/components/schemas/DriveFolderSelector'
          discriminator:
            propertyName: mode
        contentMode:
          type: string
          enum:
          - LIVE_TREE
          - ATOMIC_GENERATION
    DriveSpaceRootSelector:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          const: SPACE_ROOT
    DriveFolderSelector:
      type: object
      additionalProperties: false
      required:
      - mode
      - folderNodeId
      properties:
        mode:
          const: FOLDER
        folderNodeId:
          type: string
          minLength: 1
          maxLength: 128
    KnowledgebaseWikiSource:
      type: object
      additionalProperties: false
      required:
