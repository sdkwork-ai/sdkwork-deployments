openapi: 3.1.2
info:
  title: SDKWork Deploy App API
  description: SDKWork Deploy Server API
  version: 1.0.0
  contact:
    name: SDKWork Team
servers:
- url: https://api.deploy.sdkwork.com
  description: Production
- url: http://localhost:3900
  description: Local Development
security:
- AuthToken: []
  AccessToken: []
paths:
  /app/v3/api/domain_zones:
    get:
      operationId: domainZones.list
      summary: List root domain zones
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - PAUSED
      - name: keyword
        in: query
        schema:
          type: string
          maxLength: 253
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/DomainZoneResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: domainZones.create
      summary: Define a root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainZoneRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainZoneResponse'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/domain_zones/{zoneId}:
    parameters:
    - $ref: '#/components/parameters/DomainZoneIdParam'
    get:
      operationId: domainZones.retrieve
      summary: Retrieve a root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainZoneResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
    patch:
      operationId: domainZones.update
      summary: Update a root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDomainZoneRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainZoneResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
    delete:
      operationId: domainZones.delete
      summary: Delete an empty root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '204':
          description: Deleted
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
  /app/v3/api/domain_zones/{zoneId}/hostnames:
    parameters:
    - $ref: '#/components/parameters/DomainZoneIdParam'
    get:
      operationId: domainZones.hostnames.list
      summary: List hostnames in a root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/DomainHostnameResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: domainZones.hostnames.create
      summary: Create a hostname in a root domain zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainHostnameRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainHostnameResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/domain_zones/{zoneId}/hostnames/{hostnameId}:
    parameters:
    - $ref: '#/components/parameters/DomainZoneIdParam'
    - $ref: '#/components/parameters/DomainHostnameIdParam'
    get:
      operationId: domainZones.hostnames.retrieve
      summary: Retrieve a domain hostname
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainHostnameResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
    patch:
      operationId: domainZones.hostnames.update
      summary: Rename a domain hostname
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDomainHostnameRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainHostnameResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
    delete:
      operationId: domainZones.hostnames.delete
      summary: Delete an unbound domain hostname
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '204':
          description: Deleted
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
  /app/v3/api/domain_zones/{zoneId}/hostnames/{hostnameId}/verify:
    parameters:
    - $ref: '#/components/parameters/DomainZoneIdParam'
    - $ref: '#/components/parameters/DomainHostnameIdParam'
    post:
      operationId: domainZones.hostnames.verify
      summary: Verify domain hostname ownership
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: Verification state
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainVerifyResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/domain_zones/{zoneId}/hostname_claims:
    parameters:
    - $ref: '#/components/parameters/DomainZoneIdParam'
    post:
      operationId: domainZones.hostnameClaims.ensure
      summary: Ensure ownership of a set of hostnames
      description: 'Declares whichever of the requested hostnames the tenant does not
        own yet and runs one ownership check over each of them, so an order covering
        N names costs one round trip instead of 2N. The hostnames are fully qualified
        names rather than zone-relative ones: the server folds them back, because
        every caller that re-derives the fold is a place for the leading "*." to be
        applied twice.

        '
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureDomainHostnameClaimsRequest'
      responses:
        '200':
          description: Ownership state for every requested hostname
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/DomainHostnameClaimResponse'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/cloud_accounts:
    get:
      operationId: cloudAccounts.list
      summary: List cloud accounts usable for DNS automation
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - name: dnsProvider
        in: query
        schema:
          type: string
          enum:
          - ALIYUN_DNS
          - DNSPOD
          - CLOUDFLARE
        description: >-
          Restrict to accounts that drive this DNS family. This is what the zone and
          certificate forms send, and what makes the response short enough to be a
          picker rather than an inventory.
      - name: scopeType
        in: query
        schema:
          type: string
          enum:
          - platform
          - tenant
          - user
        description: Restrict to one visibility level; absent returns every level.
      - name: mine
        in: query
        schema:
          type: boolean
          default: false
        description: Only accounts the caller personally bound.
      - name: keyword
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/CloudAccountResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: cloudAccounts.create
      summary: Register a cloud account for DNS automation
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/CloudAccountRegistrationResponse'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 资源冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/certificates:
    get:
      operationId: certificates.list
      summary: 获取证书列表
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/CertificateResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: certificates.create
      summary: 申请证书
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRequest'
      responses:
        '201':
          description: 证书申请已触发
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/CertificateResponse'
  /app/v3/api/certificates/{certificateId}:
    parameters:
    - $ref: '#/components/parameters/CertificateIdParam'
    get:
      operationId: certificates.retrieve
      summary: 获取证书详情
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/CertificateResponse'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
    delete:
      operationId: certificates.delete
      summary: 撤销证书
      description: 撤销证书生命周期聚合并停止自动续期；密钥材料由 Secret Manager/KMS 生命周期独立管理。
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '204':
          description: 撤销成功
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters: []
  /app/v3/api/certificates/{certificateId}/renew:
    parameters:
    - $ref: '#/components/parameters/CertificateIdParam'
    post:
      operationId: certificates.renew
      summary: 计划托管证书续期
      description: 仅适用于已激活且启用自动续期的托管证书；命令将续期状态原子调整为 PLANNED，由 ACME worker 领取。
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: 续期已计划
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/CertificateResponse'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/certificates/{certificateId}/renewals:
    parameters:
    - $ref: '#/components/parameters/CertificateIdParam'
    get:
      operationId: certificates.renewals.list
      summary: 获取证书续期历史
      description: >-
        返回该证书的续期尝试台账，按创建时间倒序。每条记录保留本次尝试交接的
        有效期窗口（previousNotBefore/previousNotAfter 与 newNotBefore/newNotAfter），
        因此证书被替换之后，「这个域名在某个时间段由哪张证书覆盖」仍然可以回答；
        证书自身只保存当前状态，历史版本一旦被取代就无法从这里复原。
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/CertificateRenewalResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
        '401':
          description: 未认证
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 资源不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 校验错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /app/v3/api/upload_sessions:
    post:
      operationId: uploadSessions.create
      summary: 创建 Drive-backed 包上传会话
      tags:
      - uploadSession
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeployUploadSessionRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
