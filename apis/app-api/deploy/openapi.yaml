          type: string
          enum:
          - AUTO
          - HTTP_01
          - DNS_01
          default: AUTO
          description: >-
            Operator preference. `AUTO` resolves to HTTP_01 for a
            `SINGLE_DOMAIN` scope and always to DNS_01 for `WILDCARD`.
            `HTTP_01` is rejected for a `WILDCARD` scope.
        caProfile:
          type: string
          enum:
          - LETS_ENCRYPT_STAGING
          - LETS_ENCRYPT_PRODUCTION
          default: LETS_ENCRYPT_PRODUCTION
        preferredKeyAlgorithm:
          type: string
          enum:
          - RSA
          - ECDSA
          default: ECDSA
        autoRenew:
          type: boolean
          default: true
          description: >-
            Whether the control plane keeps this certificate renewed on its own.
            Defaults to true: asking for a managed certificate means asking for a
            name that stays covered, not for a reminder to renew it.
        renewBeforeDays:
          type: integer
          minimum: 7
          maximum: 90
          default: 30
          description: >-
            Days before expiry at which renewal starts. Stored per certificate
            rather than read from the app binding's TLS policy, because one
            certificate may back several listeners with different policies and a
            renewal trigger has to resolve to exactly one window. The configured
            lead time is additionally floored at one third of the certificate's
            lifetime, so a value larger than a short-lived certificate's lifetime
            cannot make a fresh certificate immediately due.
        providerAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{1,127}$
          description: >-
            Cloud account that presents this certificate's DNS-01 challenges,
            overriding the zone's pin so one zone can issue through several vendor
            accounts. Optional: omitting it leaves the certificate deferring to its
            zone, then to the account center, then to the deployment-level provider
            configuration, decided when an order runs.
    CertificateRenewalResponse:
      type: object
      description: >-
        One renewal attempt. The previous/new window pair is the point of the
        record: it is what makes continuous coverage auditable after the version
        it describes has been superseded.
      required:
      - id
      - certificateId
      - triggerKind
      - status
      - attemptNo
      - scheduledAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        certificateId:
          type: string
          format: uuid
        triggerKind:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
          description: >-
            `SCHEDULED` came from the due-certificate sweep, `MANUAL` from an
            operator request. Recorded rather than inferred, because it changes
            how a failure reads: a scheduled one is broken automation that keeps
            retrying on its own, a manual one is an act the operator is already
            watching.
        status:
          type: string
          enum:
          - PLANNED
          - ORDERED
          - SUCCEEDED
          - FAILED
          - SKIPPED
          - CANCELLED
          description: >-
            `PLANNED` and `ORDERED` are open, and at most one attempt per
            certificate may be open; every other value is terminal and carries
            `finishedAt`.
        attemptNo:
          type: integer
        previousVersionId:
          type: string
          format: uuid
        resultingVersionId:
          type: string
          format: uuid
        previousNotBefore:
          type: string
          format: date-time
        previousNotAfter:
          type: string
          format: date-time
          description: >-
            Expiry of the version being replaced, captured when the attempt was
            claimed, so the handover stays auditable even though that version is
            now superseded.
        newNotBefore:
          type: string
          format: date-time
        newNotAfter:
          type: string
          format: date-time
        scheduledAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
        createdAt:
          type: string
          format: date-time
    CertificateResponse:
      type: object
      required:
      - id
      - certName
      - certificateSource
      - caProfile
      - certificateScope
      - validationMethod
      - preferredKeyAlgorithm
      - identifiers
      - autoRenew
      - renewalStatus
      - renewBeforeDays
      - renewalFailureCount
      - status
      - createdAt
      - updatedAt
      - version
      properties:
        id:
          type: string
          format: uuid
        certName:
          type: string
        certificateSource:
          type: string
          enum:
          - MANAGED
          - CUSTOM
        caProfile:
          type: string
          enum:
          - LETS_ENCRYPT_STAGING
          - LETS_ENCRYPT_PRODUCTION
          - CUSTOM
        certificateScope:
          type: string
          enum:
          - SINGLE_DOMAIN
          - WILDCARD
        validationMethod:
          type: string
          enum:
          - AUTO
          - HTTP_01
          - DNS_01
          description: >-
            The resolved method the challenge orchestrator must present. A
            `WILDCARD` certificate always reports `DNS_01`.
        providerAccountId:
          type: string
          description: >-
            The cloud account pinned to present this certificate's DNS-01
            challenges, absent when the certificate defers to its zone or to the
            deployment-level provider configuration.
        preferredKeyAlgorithm:
          type: string
          enum:
          - RSA
          - ECDSA
        identifiers:
          type: array
          items:
            type: string
            format: hostname
        currentVersionId:
          type: string
          format: uuid
        issuer:
          type: string
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        autoRenew:
          type: boolean
        renewalStatus:
          type: string
          enum:
          - NONE
          - PLANNED
          - PROCESSING
          - FAILED
        status:
          type: string
          enum:
          - PENDING
          - ISSUING
          - ACTIVE
          - EXPIRED
          - FAILED
          - REVOKED
        renewBeforeDays:
          type: integer
          minimum: 7
          maximum: 90
          description: >-
            Lead time before expiry at which renewal starts. The server sends the
            derived instants below so every surface agrees on one window rule
            instead of each re-implementing it.
        renewalDueAt:
          type: string
          format: date-time
          description: >-
            When renewal work becomes due for the version being served:
            `max(notBefore + lifetime/3, notAfter - renewBeforeDays)`. The
            lifetime floor keeps a lead time longer than a short-lived
            certificate's own life from making a fresh certificate immediately
            due.
        daysUntilExpiry:
          type: integer
          description: >-
            Whole days until the served version expires, floored; negative once
            past. Floored so that a certificate with twelve hours left and one
            that expired yesterday cannot both render as `0`.
        validityPhase:
          type: string
          enum:
          - NOT_YET_VALID
          - VALID
          - EXPIRING_SOON
          - EXPIRED
          description: >-
            Where the served version sits in its validity window right now.
            Computed at read time, never stored: a persisted phase would be wrong
            from the instant the clock crossed a boundary.
        lastRenewalAt:
          type: string
          format: date-time
          description: When renewal last ran to completion, successfully or not.
        renewalFailureCount:
          type: integer
          description: >-
            Consecutive failed renewal attempts, reset to zero by a success.
            Exposed because the retry backoff hides repetition from the schedule:
            without it a certificate failing every day is indistinguishable from
            one that has never been tried.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
          pattern: ^[0-9]+$
    CertificatePage:
      type: object
      properties:
        items:
          type: array
