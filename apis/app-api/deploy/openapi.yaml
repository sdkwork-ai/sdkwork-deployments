        id:
          type: string
          format: uuid
        apexHostname:
          type: string
        scope:
          type: string
          enum:
          - USER
          - PLATFORM
          description: >-
            Who owns the zone. `USER` is a root domain an operator defined and
            owns; `PLATFORM` is the tenant-level `app.<suffix>` zone the
            deployment provisions for app publishing hostnames, which has no
            owner and is visible to every tenant member. A client that lists
            "my root domains" must not present a `PLATFORM` zone as one.
        displayName:
          type: string
        dnsProvider:
          type: string
        providerAccountId:
          type: string
          description: >-
            The cloud account pinned to serve this zone's DNS-01 challenges, absent
            when the zone has none and resolves one per issuance.
        status:
          type: string
          enum:
